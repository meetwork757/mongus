<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MONGUS</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
body { background: #050510; color: #eee; overflow: hidden; height: 100vh; }
#game-container { position: relative; width: 100%; height: 100vh; }
canvas { display: block; background: #1a1a2e; margin: 0 auto; }
#ui { position: absolute; top: 10px; left: 10px; right: 10px; pointer-events: none; }
#ui * { pointer-events: auto; }
.panel { background: rgba(0,0,0,0.75); padding: 10px; border-radius: 10px; margin-bottom: 8px; max-width: 280px; }
h1 { font-size: 1.8em; background: linear-gradient(90deg,#ff4444,#ffaa00,#00ccff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
input, button { width: 100%; padding: 8px; margin: 4px 0; border: none; border-radius: 6px; }
button { background: #e94560; color: white; font-weight: bold; cursor: pointer; }
.hidden { display: none !important; }
#chat-box { position: absolute; bottom: 10px; left: 10px; width: 260px; max-height: 150px; overflow-y: auto; background: rgba(0,0,0,0.6); border-radius: 8px; padding: 6px; font-size: 13px; }
#chat-input { position: absolute; bottom: 10px; left: 280px; width: 180px; }
#controls { position: absolute; bottom: 20px; right: 20px; }
.joystick { width: 100px; height: 100px; background: rgba(255,255,255,0.15); border-radius: 50%; position: relative; touch-action: none; }
.joystick-knob { width: 40px; height: 40px; background: #fff; border-radius: 50%; position: absolute; left: 30px; top: 30px; }
.role-card { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; }
.role-box { text-align: center; padding: 30px; border-radius: 16px; }
.crew { background: linear-gradient(#0066cc,#00aaff); }
.impostor { background: linear-gradient(#aa0000,#ff3333); }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game" width="800" height="500"></canvas>
  <div id="ui">
    <div id="login" class="panel">
      <h1>MONGUS</h1>
      <input id="username" placeholder="Name" maxlength="12">
      <div id="colors" style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;"></div>
      <button onclick="startSetup()">Continue</button>
    </div>
    <div id="mode" class="panel hidden">
      <input id="room-code" placeholder="Room code">
      <button onclick="createRoom()">Create Room</button>
      <button onclick="joinRoom()">Join Room</button>
    </div>
    <div id="lobby" class="panel hidden">
      <div id="room-info"></div>
      <div id="player-list"></div>
      <button id="ready-btn" onclick="toggleReady()">Ready</button>
      <button id="start-btn" class="hidden" onclick="startGame()" disabled>Start</button>
    </div>
    <div id="game-ui" class="panel hidden">
      <div id="status">Playing</div>
      <div id="tasks">Tasks: 0/5</div>
      <button id="kill-btn" class="hidden" onclick="tryKill()">KILL</button>
      <button onclick="callMeeting()">MEETING</button>
    </div>
  </div>
  <div id="chat-box"></div>
  <input id="chat-input" placeholder="Chat..." onkeypress="if(event.key==='Enter')sendChat()">
  <div id="controls" class="hidden">
    <div class="joystick" id="joystick"><div class="joystick-knob" id="knob"></div></div>
  </div>
</div>
<div id="role-card" class="hidden">
  <div class="role-box" id="role-box">
    <h2 id="role-title"></h2>
    <p id="role-desc"></p>
    <button onclick="closeRole()">Go</button>
  </div>
</div>

<script>
const COLORS = ['#ff4444','#ff8800','#ffdd00','#44ff44','#00ddff','#4488ff','#aa44ff','#ff44aa'];
let peer, myId, myName, myColor = COLORS[0], isHost = false, players = {}, myRole = null;
let connections = {}, ready = false, gameStarted = false, eliminated = {};
let canvas, ctx, keys = {}, joyX = 0, joyY = 0;
const MAP_W = 800, MAP_H = 500;
const rooms = [
  {x:50,y:50,w:200,h:150,name:'Cafeteria'},
  {x:300,y:50,w:180,h:120,name:'Medbay'},
  {x:520,y:50,w:230,h:150,name:'Engine'},
  {x:50,y:250,w:180,h:180,name:'Electrical'},
  {x:280,y:220,w:220,h:200,name:'Admin'},
  {x:540,y:250,w:210,h:180,name:'Storage'}
];
const taskSpots = [
  {x:120,y:100,done:false,name:'Wires'},
  {x:380,y:90,done:false,name:'Scan'},
  {x:600,y:100,done:false,name:'Fuel'},
  {x:100,y:320,done:false,name:'Lights'},
  {x:380,y:300,done:false,name:'Download'}
];
let myTasksDone = 0;

function init() {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  const colors = document.getElementById('colors');
  colors.innerHTML = '';
  COLORS.forEach(c => {
    const d = document.createElement('div');
    d.style.cssText = `width:32px;height:32px;border-radius:50%;background:${c};cursor:pointer;border:3px solid ${c===myColor?'white':'transparent'}`;
    d.onclick = () => { myColor = c; init(); };
    colors.appendChild(d);
  });
  window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
  window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
  setupJoystick();
  requestAnimationFrame(loop);
}
function setupJoystick() {
  const joy = document.getElementById('joystick');
  const knob = document.getElementById('knob');
  let dragging = false;
  joy.addEventListener('pointerdown', e => { dragging = true; joy.setPointerCapture(e.pointerId); });
  joy.addEventListener('pointermove', e => {
    if (!dragging) return;
    const r = joy.getBoundingClientRect();
    const dx = e.clientX - r.left - 50;
    const dy = e.clientY - r.top - 50;
    const dist = Math.min(40, Math.hypot(dx,dy));
    const ang = Math.atan2(dy,dx);
    knob.style.left = (30 + Math.cos(ang)*dist) + 'px';
    knob.style.top = (30 + Math.sin(ang)*dist) + 'px';
    joyX = Math.cos(ang) * (dist/40);
    joyY = Math.sin(ang) * (dist/40);
  });
  joy.addEventListener('pointerup', () => { dragging = false; joyX = joyY = 0; knob.style.left = '30px'; knob.style.top = '30px'; });
}
function startSetup() {
  myName = document.getElementById('username').value.trim();
  if (!myName) return alert('Name?');
  document.getElementById('login').classList.add('hidden');
  document.getElementById('mode').classList.remove('hidden');
}
function createRoom() {
  const code = document.getElementById('room-code').value.trim();
  if (!code) return alert('Room code?');
  isHost = true;
  peer = new Peer(code);
  peer.on('open', id => {
    myId = id;
    document.getElementById('mode').classList.add('hidden');
    document.getElementById('lobby').classList.remove('hidden');
    document.getElementById('room-info').textContent = 'Room: ' + id;
    players[myId] = {id:myId, name:myName, color:myColor, x:400, y:250, ready:false, role:null};
    peer.on('connection', conn => {
      conn.on('open', () => {
        connections[conn.peer] = conn;
        conn.on('data', d => handle(d, conn));
      });
    });
  });
  peer.on('error', e => alert(e.type==='unavailable-id'?'Code taken':e));
}
function joinRoom() {
  const code = document.getElementById('room-code').value.trim();
  if (!code) return alert('Room code?');
  isHost = false;
  peer = new Peer();
  peer.on('open', id => {
    myId = id;
    const conn = peer.connect(code);
    conn.on('open', () => {
      connections[code] = conn;
      document.getElementById('mode').classList.add('hidden');
      document.getElementById('lobby').classList.remove('hidden');
      document.getElementById('room-info').textContent = 'Room: ' + code;
      conn.send({type:'join', id:myId, name:myName, color:myColor});
      conn.on('data', d => handle(d, conn));
    });
  });
}
function toggleReady() {
  ready = !ready;
  players[myId].ready = ready;
  document.getElementById('ready-btn').textContent = ready ? 'Unready' : 'Ready';
  if (isHost) updateLobby(); else Object.values(connections)[0].send({type:'ready', id:myId, ready});
}
function updateLobby() {
  const list = document.getElementById('player-list');
  list.innerHTML = Object.values(players).map(p => `<div style="display:flex;align-items:center;gap:6px;"><div style="width:16px;height:16px;border-radius:50%;background:${p.color}"></div>${p.name} ${p.ready?'✓':''}</div>`).join('');
  const allReady = Object.values(players).every(p => p.ready) && Object.keys(players).length >= 4;
  if (isHost) {
    document.getElementById('start-btn').classList.remove('hidden');
    document.getElementById('start-btn').disabled = !allReady;
    broadcast({type:'players', players});
  }
}
function startGame() {
  if (!isHost) return;
  const ids = Object.keys(players);
  const impCount = ids.length >= 7 ? 2 : 1;
  const roles = Array(impCount).fill('Impostor').concat(Array(ids.length-impCount).fill('Crewmate'));
  for (let i=roles.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [roles[i],roles[j]]=[roles[j],roles[i]]; }
  ids.forEach((id,i) => {
    players[id].role = roles[i];
    if (id === myId) { myRole = roles[i]; showRole(); }
    else if (connections[id]) connections[id].send({type:'role', role:roles[i]});
  });
  broadcast({type:'game_start'});
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('game-ui').classList.remove('hidden');
  document.getElementById('controls').classList.remove('hidden');
  gameStarted = true;
}
function showRole() {
  const box = document.getElementById('role-box');
  document.getElementById('role-title').textContent = myRole === 'Impostor' ? 'IMPOSTOR' : 'CREWMATE';
  document.getElementById('role-desc').textContent = myRole === 'Impostor' ? 'Kill the crew.' : 'Do tasks. Find the impostor.';
  box.className = 'role-box ' + (myRole === 'Impostor' ? 'impostor' : 'crew');
  document.getElementById('role-card').classList.remove('hidden');
  document.getElementById('kill-btn').classList.toggle('hidden', myRole !== 'Impostor');
}
function closeRole() { document.getElementById('role-card').classList.add('hidden'); }
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
function update() {
  if (!gameStarted || !players[myId] || eliminated[myId]) return;
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  dx += joyX; dy += joyY;
  const speed = 2.5;
  const p = players[myId];
  p.x = Math.max(20, Math.min(MAP_W-20, p.x + dx * speed));
  p.y = Math.max(20, Math.min(MAP_H-20, p.y + dy * speed));
  if (myRole === 'Crewmate') {
    taskSpots.forEach(t => {
      if (!t.done && Math.hypot(p.x - t.x, p.y - t.y) < 30) {
        t.done = true;
        myTasksDone++;
        document.getElementById('tasks').textContent = 'Tasks: ' + myTasksDone + '/5';
        if (isHost) checkWin(); else Object.values(connections)[0].send({type:'task'});
      }
    });
  }
  if (isHost) broadcast({type:'pos', id:myId, x:p.x, y:p.y});
  else if (Object.values(connections)[0]) Object.values(connections)[0].send({type:'pos', id:myId, x:p.x, y:p.y});
}
function draw() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0,0,MAP_W,MAP_H);
  rooms.forEach(r => {
    ctx.fillStyle = '#2a2a4a';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = '#555';
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = '#aaa';
    ctx.font = '12px sans-serif';
    ctx.fillText(r.name, r.x+8, r.y+16);
  });
  taskSpots.forEach(t => {
    if (!t.done) {
      ctx.fillStyle = '#ffaa00';
      ctx.beginPath(); ctx.arc(t.x, t.y, 8, 0, Math.PI*2); ctx.fill();
    }
  });
  Object.values(players).forEach(p => {
    if (eliminated[p.id]) ctx.globalAlpha = 0.4;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, p.x, p.y - 22);
    ctx.globalAlpha = 1;
  });
}
function tryKill() {
  if (myRole !== 'Impostor' || eliminated[myId]) return;
  const me = players[myId];
  let closest = null, dist = 40;
  Object.values(players).forEach(p => {
    if (p.id === myId || eliminated[p.id]) return;
    const d = Math.hypot(me.x - p.x, me.y - p.y);
    if (d < dist) { dist = d; closest = p; }
  });
  if (!closest) return alert('No one nearby');
  if (isHost) {
    eliminated[closest.id] = true;
    broadcast({type:'killed', id:closest.id});
    checkWin();
  } else Object.values(connections)[0].send({type:'kill', target:closest.id});
}
function callMeeting() {
  if (eliminated[myId]) return;
  const reason = myName + ' called a meeting';
  if (isHost) startMeeting(reason); else Object.values(connections)[0].send({type:'meeting', reason});
}
function startMeeting(reason) {
  alert(reason + '\n(Voting simplified for now)');
  const names = Object.values(players).filter(p => !eliminated[p.id]).map(p => p.name);
  const vote = prompt('Who to eject?\n' + names.join('\n') + '\nOr type skip');
  if (isHost) resolveVote(vote); else Object.values(connections)[0].send({type:'vote', vote});
}
function resolveVote(vote) {
  alert('Voting done. Continue playing.');
}
function checkWin() {
  const alive = Object.values(players).filter(p => !eliminated[p.id]);
  const imps = alive.filter(p => p.role === 'Impostor').length;
  if (imps === 0) broadcast({type:'win', w:'Crewmates'});
  else if (imps >= alive.length - imps) broadcast({type:'win', w:'Impostors'});
}
function handle(data) {
  if (data.type === 'join' && isHost) {
    players[data.id] = {id:data.id, name:data.name, color:data.color, x:400, y:250, ready:false};
    updateLobby();
  } else if (data.type === 'ready' && isHost) {
    if (players[data.id]) players[data.id].ready = data.ready;
    updateLobby();
  } else if (data.type === 'players') {
    players = data.players;
    updateLobby();
  } else if (data.type === 'role') {
    myRole = data.role; showRole();
  } else if (data.type === 'game_start') {
    document.getElementById('lobby').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');
    document.getElementById('controls').classList.remove('hidden');
    gameStarted = true;
  } else if (data.type === 'pos') {
    if (players[data.id]) { players[data.id].x = data.x; players[data.id].y = data.y; }
  } else if (data.type === 'killed') {
    eliminated[data.id] = true;
  } else if (data.type === 'kill' && isHost) {
    eliminated[data.target] = true;
    broadcast({type:'killed', id:data.target});
    checkWin();
  } else if (data.type === 'meeting') {
    if (isHost) startMeeting(data.reason);
  } else if (data.type === 'chat') {
    addChat(data.name, data.text);
    if (isHost) broadcast(data);
  } else if (data.type === 'task' && isHost) {
    checkWin();
  } else if (data.type === 'win') {
    alert(data.w + ' win!');
  }
}
function broadcast(msg) { Object.values(connections).forEach(c => { try{c.send(msg)}catch(e){} }); }
function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim(); if (!text) return;
  addChat(myName, text);
  const msg = {type:'chat', name: myName, text};
  if (isHost) broadcast(msg); else Object.values(connections)[0].send(msg);
  input.value = '';
}
function addChat(name, text) {
  const box = document.getElementById('chat-box');
  box.innerHTML += `<div><b>${name}:</b> ${text}</div>`;
  box.scrollTop = box.scrollHeight;
}
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MONGUS</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
body { background: #0a0a1a; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; }
.container { width: 100%; max-width: 520px; background: rgba(20,20,40,0.9); border-radius: 16px; padding: 16px; border: 2px solid #333; }
h1 { text-align: center; font-size: 2.5em; margin-bottom: 10px; background: linear-gradient(90deg, #ff4d4d, #ffaa00, #00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
.subtitle { text-align: center; color: #888; margin-bottom: 15px; font-size: 0.9em; }
input, button { width: 100%; padding: 12px; margin: 6px 0; border: none; border-radius: 10px; font-size: 16px; }
input { background: #1a1a3a; color: white; border: 1px solid #444; }
button { background: #e94560; color: white; cursor: pointer; font-weight: bold; }
button:hover { background: #ff6b81; }
button:disabled { background: #444; cursor: not-allowed; }
.hidden { display: none !important; }
.colors { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }
.color-dot { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
.color-dot.selected { border-color: white; transform: scale(1.1); }
.player-list { max-height: 180px; overflow-y: auto; background: #111; border-radius: 10px; padding: 8px; margin: 10px 0; }
.player { display: flex; align-items: center; gap: 10px; padding: 6px; border-bottom: 1px solid #222; }
.player-dot { width: 28px; height: 28px; border-radius: 50%; }
#chat { height: 180px; overflow-y: auto; background: #111; border-radius: 10px; padding: 8px; margin: 8px 0; font-size: 14px; }
.msg { margin: 4px 0; }
.status { text-align: center; margin: 8px 0; color: #aaa; font-size: 0.9em; }
.task-item { background: #1a1a3a; padding: 8px; margin: 4px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
.role-card { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 100; }
.role-box { text-align: center; padding: 30px; border-radius: 20px; width: 80%; max-width: 320px; }
.role-box.crew { background: linear-gradient(145deg, #0066aa, #00aaff); }
.role-box.impostor { background: linear-gradient(145deg, #aa0000, #ff3333); }
.role-box h2 { font-size: 2.2em; margin-bottom: 10px; }
.ghost { opacity: 0.5; }
.banner { background: #222; padding: 8px; border-radius: 8px; text-align: center; margin: 8px 0; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <h1>MONGUS</h1>
  <div class="subtitle">There is an Impostor among us...</div>

  <!-- Login -->
  <div id="login">
    <input type="text" id="username" placeholder="Your name" maxlength="12">
    <div class="colors" id="color-picker"></div>
    <button onclick="setUsername()">Continue</button>
  </div>

  <!-- Mode -->
  <div id="mode" class="hidden">
    <h3 style="text-align:center;">Create Room</h3>
    <input type="text" id="custom-room" placeholder="Room code (e.g. MONGUS1)" maxlength="15">
    <button onclick="createRoom()">Create Room</button>
    <hr style="margin:12px 0; border-color:#333;">
    <h3 style="text-align:center;">Join Room</h3>
    <input type="text" id="join-room" placeholder="Enter room code">
    <button onclick="joinRoom()">Join</button>
  </div>

  <!-- Lobby -->
  <div id="lobby" class="hidden">
    <div class="status" id="room-display"></div>
    <div class="player-list" id="lobby-list"></div>
    <button id="ready-btn" onclick="toggleReady()">Ready</button>
    <div class="status" id="ready-status">0 ready</div>
    <button id="start-btn" class="hidden" onclick="startGame()" disabled>Start Game</button>
  </div>

  <!-- Game -->
  <div id="game" class="hidden">
    <div class="status" id="game-status">Playing...</div>
    <div id="spectator-banner" class="banner hidden">You are a Ghost. You can watch but not interact.</div>
    <div id="tasks-section">
      <h3>Your Tasks</h3>
      <div id="tasks"></div>
    </div>
    <div id="impostor-actions" class="hidden">
      <h3 style="color:#ff4444;">Impostor Actions</h3>
      <div id="kill-list" class="player-list"></div>
      <button id="kill-btn" onclick="submitKill()" disabled>Kill</button>
    </div>
    <button id="meeting-btn" onclick="callMeeting()">Call Emergency Meeting</button>
    <div id="chat"></div>
    <input type="text" id="chat-input" placeholder="Chat..." onkeypress="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">Send</button>
  </div>

  <!-- Meeting -->
  <div id="meeting" class="hidden">
    <h2 style="text-align:center;">Emergency Meeting</h2>
    <div class="status" id="meeting-reason"></div>
    <div id="vote-list" class="player-list"></div>
    <button onclick="submitVote()">Vote to Eject</button>
    <div class="status" id="vote-status"></div>
  </div>
</div>

<div id="role-card" class="hidden">
  <div class="role-box" id="role-box">
    <h2 id="role-title"></h2>
    <p id="role-desc"></p>
    <button onclick="closeRole()" style="margin-top:15px;">Continue</button>
  </div>
</div>

<script>
const COLORS = ['#ff4444','#ff8800','#ffdd00','#44ff44','#00ddff','#4488ff','#aa44ff','#ff44aa','#888888','#ffffff'];
let peer, myId, myName, myColor = COLORS[0], isHost = false, players = [], myRole = null;
let connections = {}, ready = false, gameStarted = false, eliminated = [], tasks = [], tasksDone = 0;
let killTarget = null, voteTarget = null, votes = {};

function initColors() {
  const picker = document.getElementById('color-picker');
  picker.innerHTML = '';
  COLORS.forEach(c => {
    const d = document.createElement('div');
    d.className = 'color-dot' + (c === myColor ? ' selected' : '');
    d.style.background = c;
    d.onclick = () => { myColor = c; initColors(); };
    picker.appendChild(d);
  });
}
initColors();

function setUsername() {
  myName = document.getElementById('username').value.trim();
  if (!myName) return alert('Enter a name');
  document.getElementById('login').classList.add('hidden');
  document.getElementById('mode').classList.remove('hidden');
}

function createRoom() {
  const code = document.getElementById('custom-room').value.trim();
  if (!code) return alert('Enter a room code');
  if (!/^[a-zA-Z0-9_-]+$/.test(code)) return alert('Only letters, numbers, - and _');
  isHost = true;
  peer = new Peer(code);
  peer.on('open', id => {
    myId = id;
    document.getElementById('room-display').textContent = 'Room: ' + id + ' (share this)';
    document.getElementById('mode').classList.add('hidden');
    document.getElementById('lobby').classList.remove('hidden');
    addPlayer({id: myId, name: myName, color: myColor, ready: false});
    peer.on('connection', conn => {
      conn.on('open', () => {
        connections[conn.peer] = conn;
        conn.on('data', d => handle(d, conn));
        conn.on('close', () => removePlayer(conn.peer));
      });
    });
  });
  peer.on('error', e => alert(e.type === 'unavailable-id' ? 'Room code taken' : e));
}

function joinRoom() {
  const code = document.getElementById('join-room').value.trim();
  if (!code) return alert('Enter room code');
  isHost = false;
  peer = new Peer();
  peer.on('open', id => {
    myId = id;
    const conn = peer.connect(code);
    conn.on('open', () => {
      connections[code] = conn;
      document.getElementById('mode').classList.add('hidden');
      document.getElementById('lobby').classList.remove('hidden');
      document.getElementById('room-display').textContent = 'Room: ' + code;
      conn.send({type:'join', id: myId, name: myName, color: myColor});
      conn.on('data', d => handle(d, conn));
      conn.on('close', () => alert('Host left'));
    });
  });
  peer.on('error', e => alert(e));
}

function addPlayer(p) {
  if (!players.find(x => x.id === p.id)) players.push(p);
  updateLobby();
  if (isHost) broadcast({type:'players', players: players.map(({id,name,color,ready}) => ({id,name,color,ready}))});
}
function removePlayer(id) {
  players = players.filter(p => p.id !== id);
  delete connections[id];
  updateLobby();
  if (isHost) broadcast({type:'players', players});
}
function updateLobby() {
  const list = document.getElementById('lobby-list');
  list.innerHTML = players.map(p => `<div class="player"><div class="player-dot" style="background:${p.color}"></div>${p.name} ${p.ready?'✓':''}</div>`).join('');
  const r = players.filter(p => p.ready).length;
  document.getElementById('ready-status').textContent = r + '/' + players.length + ' ready';
  const can = players.length >= 4 && r === players.length;
  if (isHost) {
    document.getElementById('start-btn').classList.remove('hidden');
    document.getElementById('start-btn').disabled = !can;
  }
}
function toggleReady() {
  ready = !ready;
  const me = players.find(p => p.id === myId);
  if (me) me.ready = ready;
  document.getElementById('ready-btn').textContent = ready ? 'Unready' : 'Ready';
  if (isHost) updateLobby();
  else Object.values(connections)[0].send({type:'ready', id: myId, ready});
}

function startGame() {
  if (!isHost) return;
  const n = players.length;
  const impostorCount = n >= 7 ? 2 : 1;
  const roles = Array(impostorCount).fill('Impostor').concat(Array(n - impostorCount).fill('Crewmate'));
  for (let i = roles.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [roles[i],roles[j]]=[roles[j],roles[i]]; }
  players.forEach((p,i) => {
    p.role = roles[i];
    if (p.id === myId) { myRole = p.role; showRole(); }
    else if (connections[p.id]) connections[p.id].send({type:'role', role: p.role});
  });
  gameStarted = true;
  eliminated = [];
  broadcast({type:'game_start'});
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  setupTasks();
}
function showRole() {
  const box = document.getElementById('role-box');
  const title = document.getElementById('role-title');
  const desc = document.getElementById('role-desc');
  if (myRole === 'Impostor') {
    box.className = 'role-box impostor';
    title.textContent = 'IMPOSTOR';
    desc.textContent = 'Kill the crew. Don\'t get voted out.';
  } else {
    box.className = 'role-box crew';
    title.textContent = 'CREWMATE';
    desc.textContent = 'Complete tasks and find the Impostor.';
  }
  document.getElementById('role-card').classList.remove('hidden');
}
function closeRole() {
  document.getElementById('role-card').classList.add('hidden');
  updateGameUI();
}
function setupTasks() {
  tasks = ['Fix wiring', 'Swipe card', 'Clean vent', 'Download data', 'Empty garbage'];
  tasksDone = 0;
  updateTasks();
}
function updateTasks() {
  const el = document.getElementById('tasks');
  if (myRole !== 'Crewmate' || eliminated.includes(myId)) { el.innerHTML = '<p>No tasks (Impostor or Ghost)</p>'; return; }
  el.innerHTML = tasks.map((t,i) => `<div class="task-item">${t} <button onclick="completeTask(${i})">Do</button></div>`).join('');
}
function completeTask(i) {
  if (eliminated.includes(myId) || myRole !== 'Crewmate') return;
  tasks.splice(i,1);
  tasksDone++;
  updateTasks();
  if (isHost) checkWin();
  else Object.values(connections)[0].send({type:'task_done'});
}
function updateGameUI() {
  const isGhost = eliminated.includes(myId);
  document.getElementById('spectator-banner').classList.toggle('hidden', !isGhost);
  document.getElementById('impostor-actions').classList.toggle('hidden', myRole !== 'Impostor' || isGhost);
  document.getElementById('meeting-btn').disabled = isGhost;
  document.getElementById('chat-input').disabled = isGhost;
  if (myRole === 'Impostor' && !isGhost) updateKillList();
}
function updateKillList() {
  const list = document.getElementById('kill-list');
  const alive = players.filter(p => !eliminated.includes(p.id) && p.id !== myId);
  list.innerHTML = alive.map(p => `<div class="player"><div class="player-dot" style="background:${p.color}"></div>${p.name} <button onclick="selectKill('${p.id}')">Kill</button></div>`).join('');
  document.getElementById('kill-btn').disabled = !killTarget;
}
function selectKill(id) { killTarget = id; updateKillList(); }
function submitKill() {
  if (!killTarget || eliminated.includes(myId) || myRole !== 'Impostor') return;
  if (isHost) {
    eliminated.push(killTarget);
    broadcast({type:'killed', id: killTarget});
    checkWin();
  } else Object.values(connections)[0].send({type:'kill', target: killTarget});
  killTarget = null;
  updateKillList();
  alert('Killed!');
}
function callMeeting() {
  if (eliminated.includes(myId)) return;
  const reason = 'Emergency Meeting called by ' + myName;
  if (isHost) startMeeting(reason);
  else Object.values(connections)[0].send({type:'meeting', reason});
}
function startMeeting(reason) {
  document.getElementById('game').classList.add('hidden');
  document.getElementById('meeting').classList.remove('hidden');
  document.getElementById('meeting-reason').textContent = reason;
  votes = {};
  updateVoteList();
  if (isHost) broadcast({type:'meeting_start', reason});
}
function updateVoteList() {
  const list = document.getElementById('vote-list');
  const alive = players.filter(p => !eliminated.includes(p.id));
  list.innerHTML = alive.map(p => `<div class="player"><div class="player-dot" style="background:${p.color}"></div>${p.name} <button onclick="vote('${p.id}')">Vote</button></div>`).join('') +
    '<div class="player"><button onclick="vote(\'skip\')">Skip Vote</button></div>';
}
function vote(id) { voteTarget = id; }
function submitVote() {
  if (!voteTarget || eliminated.includes(myId)) return;
  if (isHost) { votes[myId] = voteTarget; checkVotes(); }
  else Object.values(connections)[0].send({type:'vote', id: myId, target: voteTarget});
  alert('Vote cast');
}
function checkVotes() {
  if (!isHost) return;
  const alive = players.filter(p => !eliminated.includes(p.id));
  if (Object.keys(votes).length < alive.length) return;
  const counts = {};
  Object.values(votes).forEach(t => counts[t] = (counts[t]||0)+1);
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  let result = 'No one was ejected.';
  if (sorted[0][0] !== 'skip' && sorted[0][1] > 1) {
    const ejected = players.find(p => p.id === sorted[0][0]);
    if (ejected) {
      eliminated.push(ejected.id);
      result = ejected.name + ' was ejected! ' + (ejected.role === 'Impostor' ? 'They were the Impostor!' : 'They were not the Impostor.');
    }
  }
  broadcast({type:'meeting_end', result, eliminated});
  endMeeting(result);
}
function endMeeting(result) {
  alert(result);
  document.getElementById('meeting').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  updateGameUI();
  if (isHost) checkWin();
}
function checkWin() {
  if (!isHost) return;
  const alive = players.filter(p => !eliminated.includes(p.id));
  const impostorsAlive = alive.filter(p => p.role === 'Impostor').length;
  const crewAlive = alive.length - impostorsAlive;
  if (impostorsAlive === 0) broadcast({type:'win', winner: 'Crewmates'});
  else if (impostorsAlive >= crewAlive) broadcast({type:'win', winner: 'Impostors'});
  else if (tasksDone >= 15) broadcast({type:'win', winner: 'Crewmates (tasks)'});
}
function handle(data, conn) {
  if (data.type === 'join' && isHost) {
    if (players.length >= 10) return conn.send({type:'error', msg:'Full'});
    addPlayer({id: data.id, name: data.name, color: data.color, ready: false});
  } else if (data.type === 'ready' && isHost) {
    const p = players.find(x => x.id === data.id); if (p) p.ready = data.ready; updateLobby();
  } else if (data.type === 'players') {
    players = data.players; updateLobby();
  } else if (data.type === 'role') {
    myRole = data.role; showRole();
  } else if (data.type === 'game_start') {
    document.getElementById('lobby').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    setupTasks();
  } else if (data.type === 'killed') {
    eliminated.push(data.id); updateGameUI();
  } else if (data.type === 'meeting') {
    if (isHost) startMeeting(data.reason);
  } else if (data.type === 'meeting_start') {
    startMeeting(data.reason);
  } else if (data.type === 'vote' && isHost) {
    votes[data.id] = data.target; checkVotes();
  } else if (data.type === 'meeting_end') {
    eliminated = data.eliminated || eliminated;
    endMeeting(data.result);
  } else if (data.type === 'chat') {
    addChat(data.name, data.text);
    if (isHost) broadcast(data);
  } else if (data.type === 'task_done' && isHost) {
    tasksDone++; checkWin();
  } else if (data.type === 'win') {
    alert(data.winner + ' win!');
  } else if (data.type === 'error') alert(data.msg);
}
function broadcast(msg) { Object.values(connections).forEach(c => { try{c.send(msg)}catch(e){} }); }
function sendChat() {
  if (eliminated.includes(myId)) return;
  const input = document.getElementById('chat-input');
  const text = input.value.trim(); if (!text) return;
  addChat(myName, text);
  const msg = {type:'chat', name: myName, text};
  if (isHost) broadcast(msg); else Object.values(connections)[0].send(msg);
  input.value = '';
}
function addChat(name, text) {
  const c = document.getElementById('chat');
  c.innerHTML += `<div class="msg"><b>${name}:</b> ${text}</div>`;
  c.scrollTop = c.scrollHeight;
}
</script>
</body>
</html>

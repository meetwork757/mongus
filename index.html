<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MONGUS</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
body { background: #050510; color: #eee; overflow: hidden; height: 100vh; }
#game-container { position: relative; width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; }
canvas { display: block; background: #1a1a2e; border: 2px solid #333; max-width: 100%; max-height: 100%; }
#ui { position: absolute; top: 10px; left: 10px; right: 10px; pointer-events: none; }
#ui * { pointer-events: auto; }
.panel { background: rgba(0,0,0,0.75); padding: 10px; border-radius: 10px; margin-bottom: 8px; max-width: 280px; }
h1 { font-size: 1.8em; background: linear-gradient(90deg,#ff4444,#ffaa00,#00ccff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
input, button { width: 100%; padding: 8px; margin: 4px 0; border: none; border-radius: 6px; }
button { background: #e94560; color: white; font-weight: bold; cursor: pointer; }
.hidden { display: none !important; }
#chat-box { position: absolute; bottom: 10px; left: 10px; width: 260px; max-height: 150px; overflow-y: auto; background: rgba(0,0,0,0.6); border-radius: 8px; padding: 6px; font-size: 13px; }
#chat-input { position: absolute; bottom: 10px; left: 280px; width: 180px; }
#controls { position: absolute; bottom: 20px; right: 20px; }
.joystick { width: 100px; height: 100px; background: rgba(255,255,255,0.15); border-radius: 50%; position: relative; touch-action: none; }
.joystick-knob { width: 40px; height: 40px; background: #fff; border-radius: 50%; position: absolute; left: 30px; top: 30px; }
.role-card { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; }
.role-box { text-align: center; padding: 30px; border-radius: 16px; }
.crew { background: linear-gradient(#0066cc,#00aaff); }
.impostor { background: linear-gradient(#aa0000,#ff3333); }
#meeting-ui { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; }
.vote-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 600px; margin: 15px 0; }
.vote-card { background: #222; padding: 12px; border-radius: 10px; text-align: center; cursor: pointer; min-width: 100px; border: 2px solid transparent; }
.vote-card:hover { border-color: #e94560; }
.vote-card.voted { border-color: #00ff88; }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game" width="900" height="600"></canvas>
  <div id="ui">
    <div id="login" class="panel">
      <h1>MONGUS</h1>
      <input id="username" placeholder="Name" maxlength="12">
      <div id="colors" style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;"></div>
      <button onclick="startSetup()">Continue</button>
    </div>
    <div id="mode" class="panel hidden">
      <input id="room-code" placeholder="Room code">
      <button onclick="createRoom()">Create Room</button>
      <button onclick="joinRoom()">Join Room</button>
    </div>
    <div id="lobby" class="panel hidden">
      <div id="room-info"></div>
      <div id="player-list"></div>
      <button id="ready-btn" onclick="toggleReady()">Ready</button>
      <button id="start-btn" class="hidden" onclick="startGame()" disabled>Start</button>
    </div>
    <div id="game-ui" class="panel hidden">
      <div id="status">Playing</div>
      <div id="tasks">Tasks: 0/5</div>
      <button id="kill-btn" class="hidden" onclick="tryKill()">KILL</button>
      <button onclick="callMeeting()">MEETING</button>
    </div>
  </div>
  <div id="chat-box"></div>
  <input id="chat-input" placeholder="Chat..." onkeypress="if(event.key==='Enter')sendChat()">
  <div id="controls" class="hidden">
    <div class="joystick" id="joystick"><div class="joystick-knob" id="knob"></div></div>
  </div>
</div>
<div id="role-card" class="hidden">
  <div class="role-box" id="role-box">
    <h2 id="role-title"></h2>
    <p id="role-desc"></p>
    <button onclick="closeRole()">Go</button>
  </div>
</div>
<div id="meeting-ui" class="hidden">
  <h2 id="meeting-title">Meeting</h2>
  <div id="meeting-timer" style="font-size:1.2em;margin:10px;">Discussion...</div>
  <div id="vote-list" class="vote-list"></div>
  <button id="skip-btn" onclick="castVote('skip')" style="width:150px;background:#444;">Skip</button>
  <div id="vote-results" style="margin-top:15px;font-size:1.1em;"></div>
</div>

<script>
const COLORS = ['#ff4444','#ff8800','#ffdd00','#44ff44','#00ddff','#4488ff','#aa44ff','#ff44aa'];
let peer, myId, myName, myColor = COLORS[0], isHost = false, players = {}, myRole = null;
let connections = {}, ready = false, gameStarted = false, eliminated = {};
let canvas, ctx, keys = {}, joyX = 0, joyY = 0;
const MAP_W = 900, MAP_H = 600;
const rooms = [
  {x:40,y:40,w:320,h:240,name:'Cafeteria', floor:'#5a3a28', wall:'#7a5a40'},
  {x:380,y:40,w:200,h:160,name:'Medbay', floor:'#2a4a5a', wall:'#3a6a7a'},
  {x:600,y:40,w:260,h:180,name:'Engine', floor:'#2a2a2a', wall:'#4a4a4a'},
  {x:40,y:300,w:200,h:220,name:'Electrical', floor:'#1a2a3a', wall:'#2a4a5a'},
  {x:260,y:280,w:280,h:240,name:'Admin', floor:'#3a3a2a', wall:'#5a5a3a'},
  {x:560,y:260,w:300,h:260,name:'Storage', floor:'#2a2a3a', wall:'#4a4a5a'}
];
const taskSpots = [
  {x:180,y:140,done:false,name:'Wires'},
  {x:460,y:100,done:false,name:'Scan'},
  {x:700,y:100,done:false,name:'Fuel'},
  {x:120,y:380,done:false,name:'Lights'},
  {x:400,y:360,done:false,name:'Download'}
];
const vents = [
  {x:200, y:180, name:'Cafe'},
  {x:460, y:120, name:'Medbay'},
  {x:720, y:120, name:'Engine'},
  {x:120, y:400, name:'Electrical'},
  {x:380, y:400, name:'Admin'},
  {x:700, y:400, name:'Storage'}
];
let ventCooldown = 0;
let ventAnim = 0;
let myTasksDone = 0;
let meetingActive = false;
let votes = {};
let meetingTimer = 0;
let meetingPhase = 'discuss';

function drawCrewmate(ctx, x, y, color, isGhost) {
  ctx.save();
  if (isGhost) ctx.globalAlpha = 0.45;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(x, y+20, 15, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x-15, y+12);
  ctx.quadraticCurveTo(x-18, y-20, x, y-24);
  ctx.quadraticCurveTo(x+18, y-20, x+15, y+12);
  ctx.quadraticCurveTo(x+11, y+22, x, y+20);
  ctx.quadraticCurveTo(x-11, y+22, x-15, y+12);
  ctx.fill();
  ctx.fillStyle = shadeColor(color, -35);
  ctx.beginPath();
  ctx.ellipse(x-17, y-1, 7, 11, -0.45, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#b0e0ff';
  ctx.beginPath();
  ctx.ellipse(x+5, y-7, 11, 8, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(x+8, y-9, 3.5, 2.2, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}
function shadeColor(color, percent) {
  const num = parseInt(color.slice(1),16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, Math.min(255, (num >> 16) + amt));
  const G = Math.max(0, Math.min(255, (num >> 8 & 0x00FF) + amt));
  const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
  return '#' + ((1 << 24) + (R << 16) + (G << 8) + B).toString(16).slice(1);
}
function drawNamePlate(ctx, room) {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(room.x+8, room.y+6, 100, 18);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText(room.name, room.x+12, room.y+19);
}
function drawCafeteria(ctx, room) {
  ctx.fillStyle = room.floor;
  ctx.fillRect(room.x, room.y, room.w, room.h);
  ctx.strokeStyle = room.wall;
  ctx.lineWidth = 8;
  ctx.strokeRect(room.x+4, room.y+4, room.w-8, room.h-8);
  drawNamePlate(ctx, room);
  const tables = [
    {x: room.x+90, y: room.y+90},
    {x: room.x+180, y: room.y+90},
    {x: room.x+135, y: room.y+150}
  ];
  tables.forEach(t => {
    ctx.fillStyle = '#6a4030';
    ctx.beginPath(); ctx.ellipse(t.x, t.y, 28, 18, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5a3020';
    ctx.beginPath(); ctx.ellipse(t.x, t.y-3, 28, 6, 0, 0, Math.PI*2); ctx.fill();
    [{dx:0,dy:-28},{dx:0,dy:28},{dx:-32,dy:0},{dx:32,dy:0}].forEach(c => {
      ctx.fillStyle = '#4a3020';
      ctx.fillRect(t.x + c.dx - 8, t.y + c.dy - 6, 16, 12);
    });
  });
  ctx.fillStyle = '#3a2a20';
  ctx.fillRect(room.x+120, room.y+190, 80, 30);
  ctx.fillStyle = '#cc3333';
  ctx.beginPath(); ctx.arc(room.x+160, room.y+205, 10, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('EMERGENCY', room.x+160, room.y+225);
  ctx.fillStyle = '#4a3020';
  ctx.fillRect(room.x+20, room.y+50, 20, 140);
}
function drawMedbay(ctx, room) {
  ctx.fillStyle = room.floor;
  ctx.fillRect(room.x, room.y, room.w, room.h);
  ctx.strokeStyle = room.wall;
  ctx.lineWidth = 6;
  ctx.strokeRect(room.x+3, room.y+3, room.w-6, room.h-6);
  drawNamePlate(ctx, room);
  ctx.fillStyle = '#4a7a9a';
  ctx.fillRect(room.x+25, room.y+45, 65, 32);
  ctx.fillRect(room.x+105, room.y+45, 65, 32);
  ctx.fillStyle = '#fff';
  ctx.fillRect(room.x+30, room.y+48, 55, 6);
  ctx.fillRect(room.x+110, room.y+48, 55, 6);
  ctx.fillStyle = '#3a5a6a';
  ctx.fillRect(room.x+50, room.y+100, 90, 25);
  ctx.fillStyle = '#00aaff';
  ctx.fillRect(room.x+70, room.y+105, 50, 4);
}
function drawEngine(ctx, room) {
  ctx.fillStyle = room.floor;
  ctx.fillRect(room.x, room.y, room.w, room.h);
  ctx.strokeStyle = room.wall;
  ctx.lineWidth = 6;
  ctx.strokeRect(room.x+3, room.y+3, room.w-6, room.h-6);
  drawNamePlate(ctx, room);
  ctx.fillStyle = '#444';
  ctx.fillRect(room.x+40, room.y+45, 55, 75);
  ctx.fillRect(room.x+165, room.y+45, 55, 75);
  ctx.fillStyle = '#ff5500';
  ctx.beginPath(); ctx.arc(room.x+67, room.y+82, 12, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(room.x+192, room.y+82, 12, 0, Math.PI*2); ctx.fill();
}
function drawElectrical(ctx, room) {
  ctx.fillStyle = room.floor;
  ctx.fillRect(room.x, room.y, room.w, room.h);
  ctx.strokeStyle = room.wall;
  ctx.lineWidth = 6;
  ctx.strokeRect(room.x+3, room.y+3, room.w-6, room.h-6);
  drawNamePlate(ctx, room);
  ctx.fillStyle = '#2a4a5a';
  ctx.fillRect(room.x+25, room.y+40, 55, 90);
  ctx.fillRect(room.x+100, room.y+40, 55, 90);
}
function drawAdmin(ctx, room) {
  ctx.fillStyle = room.floor;
  ctx.fillRect(room.x, room.y, room.w, room.h);
  ctx.strokeStyle = room.wall;
  ctx.lineWidth = 6;
  ctx.strokeRect(room.x+3, room.y+3, room.w-6, room.h-6);
  drawNamePlate(ctx, room);
  ctx.fillStyle = '#4a4a3a';
  ctx.fillRect(room.x+35, room.y+50, 85, 38);
  ctx.fillRect(room.x+145, room.y+50, 85, 38);
  ctx.fillStyle = '#1a1a2a';
  ctx.fillRect(room.x+50, room.y+55, 28, 18);
  ctx.fillRect(room.x+160, room.y+55, 28, 18);
  ctx.fillStyle = '#00ccff';
  ctx.fillRect(room.x+54, room.y+58, 20, 10);
  ctx.fillRect(room.x+164, room.y+58, 20, 10);
}
function drawStorage(ctx, room) {
  ctx.fillStyle = room.floor;
  ctx.fillRect(room.x, room.y, room.w, room.h);
  ctx.strokeStyle = room.wall;
  ctx.lineWidth = 6;
  ctx.strokeRect(room.x+3, room.y+3, room.w-6, room.h-6);
  drawNamePlate(ctx, room);
  const boxes = [
    {x:40,y:60}, {x:100,y:80}, {x:160,y:50}, {x:220,y:90}, {x:80,y:140}, {x:180,y:130}
  ];
  boxes.forEach(b => {
    ctx.fillStyle = '#6a5a4a';
    ctx.fillRect(room.x + b.x, room.y + b.y, 42, 42);
    ctx.strokeStyle = '#4a3a2a';
    ctx.lineWidth = 1;
    ctx.strokeRect(room.x + b.x, room.y + b.y, 42, 42);
  });
}
function drawRoom(ctx, room) {
  if (room.name === 'Cafeteria') drawCafeteria(ctx, room);
  else if (room.name === 'Medbay') drawMedbay(ctx, room);
  else if (room.name === 'Engine') drawEngine(ctx, room);
  else if (room.name === 'Electrical') drawElectrical(ctx, room);
  else if (room.name === 'Admin') drawAdmin(ctx, room);
  else if (room.name === 'Storage') drawStorage(ctx, room);
}
function drawVents(ctx) {
  ventAnim += 0.05;
  vents.forEach(v => {
    const pulse = 1 + Math.sin(ventAnim + v.x) * 0.15;
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(v.x, v.y, 18 * pulse, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(v.x, v.y, 12, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 1.5;
    for (let i = -8; i <= 8; i += 4) {
      ctx.beginPath();
      ctx.moveTo(v.x - 10, v.y + i);
      ctx.lineTo(v.x + 10, v.y + i);
      ctx.stroke();
    }
    if (myRole === 'Impostor' && ventCooldown <= 0) {
      const dist = Math.hypot((players[myId]?.x || 0) - v.x, (players[myId]?.y || 0) - v.y);
      if (dist < 30) {
        ctx.strokeStyle = '#ff4444';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(v.x, v.y, 22, 0, Math.PI*2); ctx.stroke();
      }
    }
  });
}

function init() {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  const colors = document.getElementById('colors');
  colors.innerHTML = '';
  COLORS.forEach(c => {
    const d = document.createElement('div');
    d.style.cssText = `width:32px;height:32px;border-radius:50%;background:${c};cursor:pointer;border:3px solid ${c===myColor?'white':'transparent'}`;
    d.onclick = () => { myColor = c; init(); };
    colors.appendChild(d);
  });
  window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
  window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
  setupJoystick();
  requestAnimationFrame(loop);
}
function setupJoystick() {
  const joy = document.getElementById('joystick');
  const knob = document.getElementById('knob');
  let dragging = false;
  joy.addEventListener('pointerdown', e => { dragging = true; joy.setPointerCapture(e.pointerId); });
  joy.addEventListener('pointermove', e => {
    if (!dragging) return;
    const r = joy.getBoundingClientRect();
    const dx = e.clientX - r.left - 50;
    const dy = e.clientY - r.top - 50;
    const dist = Math.min(40, Math.hypot(dx,dy));
    const ang = Math.atan2(dy,dx);
    knob.style.left = (30 + Math.cos(ang)*dist) + 'px';
    knob.style.top = (30 + Math.sin(ang)*dist) + 'px';
    joyX = Math.cos(ang) * (dist/40);
    joyY = Math.sin(ang) * (dist/40);
  });
  joy.addEventListener('pointerup', () => { dragging = false; joyX = joyY = 0; knob.style.left = '30px'; knob.style.top = '30px'; });
}
function startSetup() {
  myName = document.getElementById('username').value.trim();
  if (!myName) return alert('Name?');
  document.getElementById('login').classList.add('hidden');
  document.getElementById('mode').classList.remove('hidden');
}
function createRoom() {
  const code = document.getElementById('room-code').value.trim();
  if (!code) return alert('Room code?');
  isHost = true;
  peer = new Peer(code);
  peer.on('open', id => {
    myId = id;
    document.getElementById('mode').classList.add('hidden');
    document.getElementById('lobby').classList.remove('hidden');
    document.getElementById('room-info').textContent = 'Room: ' + id;
    players[myId] = {id:myId, name:myName, color:myColor, x:180, y:140, ready:false, role:null};
    peer.on('connection', conn => {
      conn.on('open', () => {
        connections[conn.peer] = conn;
        conn.on('data', d => handle(d, conn));
      });
    });
  });
  peer.on('error', e => alert(e.type==='unavailable-id'?'Code taken':e));
}
function joinRoom() {
  const code = document.getElementById('room-code').value.trim();
  if (!code) return alert('Room code?');
  isHost = false;
  peer = new Peer();
  peer.on('open', id => {
    myId = id;
    const conn = peer.connect(code);
    conn.on('open', () => {
      connections[code] = conn;
      document.getElementById('mode').classList.add('hidden');
      document.getElementById('lobby').classList.remove('hidden');
      document.getElementById('room-info').textContent = 'Room: ' + code;
      conn.send({type:'join', id:myId, name:myName, color:myColor});
      conn.on('data', d => handle(d, conn));
    });
  });
}
function toggleReady() {
  ready = !ready;
  players[myId].ready = ready;
  document.getElementById('ready-btn').textContent = ready ? 'Unready' : 'Ready';
  if (isHost) updateLobby(); else Object.values(connections)[0].send({type:'ready', id:myId, ready});
}
function updateLobby() {
  const list = document.getElementById('player-list');
  list.innerHTML = Object.values(players).map(p => `<div style="display:flex;align-items:center;gap:6px;"><div style="width:16px;height:16px;border-radius:50%;background:${p.color}"></div>${p.name} ${p.ready?'✓':''}</div>`).join('');
  const allReady = Object.values(players).every(p => p.ready) && Object.keys(players).length >= 4;
  if (isHost) {
    document.getElementById('start-btn').classList.remove('hidden');
    document.getElementById('start-btn').disabled = !allReady;
    broadcast({type:'players', players});
  }
}
function startGame() {
  if (!isHost) return;
  const ids = Object.keys(players);
  const impCount = ids.length >= 7 ? 2 : 1;
  const roles = Array(impCount).fill('Impostor').concat(Array(ids.length-impCount).fill('Crewmate'));
  for (let i=roles.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [roles[i],roles[j]]=[roles[j],roles[i]]; }
  ids.forEach((id,i) => {
    players[id].role = roles[i];
    if (id === myId) { myRole = roles[i]; showRole(); }
    else if (connections[id]) connections[id].send({type:'role', role:roles[i]});
  });
  broadcast({type:'game_start'});
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('game-ui').classList.remove('hidden');
  document.getElementById('controls').classList.remove('hidden');
  gameStarted = true;
}
function showRole() {
  const box = document.getElementById('role-box');
  document.getElementById('role-title').textContent = myRole === 'Impostor' ? 'IMPOSTOR' : 'CREWMATE';
  document.getElementById('role-desc').textContent = myRole === 'Impostor' ? 'Kill the crew. Use vents.' : 'Do tasks. Find the impostor.';
  box.className = 'role-box ' + (myRole === 'Impostor' ? 'impostor' : 'crew');
  document.getElementById('role-card').classList.remove('hidden');
  document.getElementById('kill-btn').classList.toggle('hidden', myRole !== 'Impostor');
}
function closeRole() { document.getElementById('role-card').classList.add('hidden'); }
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
function update() {
  if (meetingActive) {
    meetingTimer--;
    updateMeetingUI();
    if (meetingTimer <= 0 && meetingPhase === 'discuss') {
      meetingPhase = 'vote';
      meetingTimer = 300;
      if (isHost) broadcast({type:'meeting_phase', phase:'vote'});
    } else if (meetingTimer <= 0 && meetingPhase === 'vote') {
      resolveMeeting();
    }
    return;
  }
  if (!gameStarted || !players[myId] || eliminated[myId]) return;
  if (ventCooldown > 0) ventCooldown--;

  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  dx += joyX; dy += joyY;
  const speed = 2.8;
  const p = players[myId];
  p.x = Math.max(30, Math.min(MAP_W-30, p.x + dx * speed));
  p.y = Math.max(30, Math.min(MAP_H-30, p.y + dy * speed));

  if (myRole === 'Impostor' && ventCooldown <= 0) {
    for (const v of vents) {
      if (Math.hypot(p.x - v.x, p.y - v.y) < 22) {
        useVent(v);
        break;
      }
    }
  }

  if (myRole === 'Crewmate') {
    taskSpots.forEach(t => {
      if (!t.done && Math.hypot(p.x - t.x, p.y - t.y) < 35) {
        t.done = true;
        myTasksDone++;
        document.getElementById('tasks').textContent = 'Tasks: ' + myTasksDone + '/5';
        if (isHost) checkWin(); else Object.values(connections)[0].send({type:'task'});
      }
    });
  }
  if (isHost) broadcast({type:'pos', id:myId, x:p.x, y:p.y});
  else if (Object.values(connections)[0]) Object.values(connections)[0].send({type:'pos', id:myId, x:p.x, y:p.y});
}
function useVent(fromVent) {
  if (myRole !== 'Impostor' || ventCooldown > 0 || eliminated[myId]) return;
  const others = vents.filter(v => v !== fromVent);
  if (others.length === 0) return;
  const target = others[Math.floor(Math.random() * others.length)];
  players[myId].x = target.x;
  players[myId].y = target.y;
  ventCooldown = 180;
  if (isHost) broadcast({type:'pos', id:myId, x:target.x, y:target.y});
  else Object.values(connections)[0].send({type:'pos', id:myId, x:target.x, y:target.y});
}
function draw() {
  ctx.fillStyle = '#151525';
  ctx.fillRect(0,0,MAP_W,MAP_H);
  rooms.forEach(r => drawRoom(ctx, r));
  ctx.fillStyle = '#252535';
  ctx.fillRect(360, 100, 20, 60);
  ctx.fillRect(580, 100, 20, 60);
  ctx.fillRect(140, 280, 20, 20);
  drawVents(ctx);
  taskSpots.forEach(t => {
    if (!t.done) {
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath(); ctx.arc(t.x, t.y, 10, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(t.name, t.x, t.y-14);
    }
  });
  Object.values(players).forEach(p => {
    drawCrewmate(ctx, p.x, p.y, p.color, !!eliminated[p.id]);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, p.x, p.y - 32);
  });
  if (myRole === 'Impostor' && ventCooldown > 0) {
    ctx.fillStyle = '#ff6666';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Vent cooldown: ' + Math.ceil(ventCooldown/60) + 's', MAP_W/2, 30);
  }
}
function tryKill() {
  if (myRole !== 'Impostor' || eliminated[myId]) return;
  const me = players[myId];
  let closest = null, dist = 45;
  Object.values(players).forEach(p => {
    if (p.id === myId || eliminated[p.id]) return;
    const d = Math.hypot(me.x - p.x, me.y - p.y);
    if (d < dist) { dist = d; closest = p; }
  });
  if (!closest) return alert('No one nearby');
  if (isHost) {
    eliminated[closest.id] = true;
    broadcast({type:'killed', id:closest.id});
    checkWin();
  } else Object.values(connections)[0].send({type:'kill', target:closest.id});
}
function callMeeting() {
  if (eliminated[myId] || meetingActive) return;
  const reason = myName + ' called a meeting';
  if (isHost) startMeeting(reason); else Object.values(connections)[0].send({type:'meeting', reason});
}
function startMeeting(reason) {
  meetingActive = true;
  meetingPhase = 'discuss';
  meetingTimer = 600;
  votes = {};
  document.getElementById('meeting-ui').classList.remove('hidden');
  document.getElementById('meeting-title').textContent = reason;
  document.getElementById('vote-results').textContent = '';
  buildVoteList();
  if (isHost) broadcast({type:'meeting_start', reason});
}
function buildVoteList() {
  const list = document.getElementById('vote-list');
  list.innerHTML = '';
  Object.values(players).filter(p => !eliminated[p.id]).forEach(p => {
    const card = document.createElement('div');
    card.className = 'vote-card';
    card.innerHTML = `<div style="width:20px;height:20px;border-radius:50%;background:${p.color};margin:0 auto 6px;"></div><div>${p.name}</div>`;
    card.onclick = () => castVote(p.id);
    card.dataset.id = p.id;
    list.appendChild(card);
  });
}
function castVote(targetId) {
  if (meetingPhase !== 'vote' || votes[myId]) return;
  votes[myId] = targetId;
  document.querySelectorAll('.vote-card').forEach(c => c.classList.remove('voted'));
  if (targetId !== 'skip') {
    const card = document.querySelector(`.vote-card[data-id="${targetId}"]`);
    if (card) card.classList.add('voted');
  }
  if (isHost) {
    broadcast({type:'vote', voter:myId, target:targetId});
  } else {
    Object.values(connections)[0].send({type:'vote', voter:myId, target:targetId});
  }
}
function updateMeetingUI() {
  const timerEl = document.getElementById('meeting-timer');
  if (meetingPhase === 'discuss') {
    timerEl.textContent = 'Discussion: ' + Math.ceil(meetingTimer/60) + 's';
    document.getElementById('skip-btn').style.display = 'none';
  } else if (meetingPhase === 'vote') {
    timerEl.textContent = 'Voting: ' + Math.ceil(meetingTimer/60) + 's';
    document.getElementById('skip-btn').style.display = 'block';
  }
}
function resolveMeeting() {
  meetingPhase = 'results';
  const tally = {};
  Object.values(votes).forEach(v => {
    tally[v] = (tally[v] || 0) + 1;
  });
  let max = 0, ejected = null;
  for (const [id, count] of Object.entries(tally)) {
    if (count > max) { max = count; ejected = id; }
  }
  const skipCount = tally['skip'] || 0;
  let resultText = '';
  if (ejected && ejected !== 'skip' && max > skipCount) {
    const p = players[ejected];
    eliminated[ejected] = true;
    resultText = p.name + ' was ejected. They were ' + (p.role === 'Impostor' ? 'an Impostor!' : 'not an Impostor.');
  } else {
    resultText = 'No one was ejected.';
  }
  document.getElementById('vote-results').textContent = resultText;
  if (isHost) {
    broadcast({type:'meeting_results', text:resultText, eliminated: eliminated});
    setTimeout(() => endMeeting(), 3000);
  }
}
function endMeeting() {
  meetingActive = false;
  document.getElementById('meeting-ui').classList.add('hidden');
  if (isHost) {
    broadcast({type:'meeting_end'});
    checkWin();
  }
}
function checkWin() {
  const alive = Object.values(players).filter(p => !eliminated[p.id]);
  const imps = alive.filter(p => p.role === 'Impostor').length;
  if (imps === 0) broadcast({type:'win', w:'Crewmates'});
  else if (imps >= alive.length - imps) broadcast({type:'win', w:'Impostors'});
}
function handle(data) {
  if (data.type === 'join' && isHost) {
    players[data.id] = {id:data.id, name:data.name, color:data.color, x:180, y:140, ready:false};
    updateLobby();
  } else if (data.type === 'ready' && isHost) {
    if (players[data.id]) players[data.id].ready = data.ready;
    updateLobby();
  } else if (data.type === 'players') {
    players = data.players;
    updateLobby();
  } else if (data.type === 'role') {
    myRole = data.role; showRole();
  } else if (data.type === 'game_start') {
    document.getElementById('lobby').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');
    document.getElementById('controls').classList.remove('hidden');
    gameStarted = true;
  } else if (data.type === 'pos') {
    if (players[data.id]) { players[data.id].x = data.x; players[data.id].y = data.y; }
  } else if (data.type === 'killed') {
    eliminated[data.id] = true;
  } else if (data.type === 'kill' && isHost) {
    eliminated[data.target] = true;
    broadcast({type:'killed', id:data.target});
    checkWin();
  } else if (data.type === 'meeting') {
    if (isHost) startMeeting(data.reason);
  } else if (data.type === 'meeting_start') {
    startMeeting(data.reason);
  } else if (data.type === 'meeting_phase') {
    meetingPhase = data.phase;
    meetingTimer = 300;
  } else if (data.type === 'vote') {
    votes[data.voter] = data.target;
    if (isHost) broadcast(data);
  } else if (data.type === 'meeting_results') {
    document.getElementById('vote-results').textContent = data.text;
    eliminated = data.eliminated;
    setTimeout(() => endMeeting(), 3000);
  } else if (data.type === 'meeting_end') {
    meetingActive = false;
    document.getElementById('meeting-ui').classList.add('hidden');
  } else if (data.type === 'chat') {
    addChat(data.name, data.text);
    if (isHost) broadcast(data);
  } else if (data.type === 'task' && isHost) {
    checkWin();
  } else if (data.type === 'win') {
    alert(data.w + ' win!');
  }
}
function broadcast(msg) { Object.values(connections).forEach(c => { try{c.send(msg)}catch(e){} }); }
function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim(); if (!text) return;
  addChat(myName, text);
  const msg = {type:'chat', name:myName, text};
  if (isHost) broadcast(msg); else Object.values(connections)[0].send(msg);
  input.value = '';
}
function addChat(name, text) {
  const box = document.getElementById('chat-box');
  box.innerHTML += `<div><b>${name}:</b> ${text}</div>`;
  box.scrollTop = box.scrollHeight;
}
init();
</script>
